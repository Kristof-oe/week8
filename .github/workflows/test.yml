name: Test React App

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    Checkout:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: action/checkout@v4
    Test:
        runs-on: ubuntu-latest
        steps:
          - name: Testing
            uses: actions/setup-node@v4
            with:
                node-version: '18'

          - name: Install dependencies
            run: npm install

          - name: Run tests
            run: npm test
            
